<!--
  Humanym episode backdrop (design 2026-08-03, replaces the aged-dossier
  draft). The episodes are a HUMANYM podcast — Cone of Silence is the studio,
  Humanym is the product — so this frame wears Humanym's brand.

  This is the 1920x1080 canvas headless Chrome renders to a PNG once per
  episode (scripts/darkroom/composite.mjs's renderBackdrop). The pipeline
  never draws text or shapes itself — it reads pane geometry back from this
  live page (getBoundingClientRect on #pane-left / #pane-right), so a full
  redesign of this file never touches pipeline code. Since 2026-08-03 the
  compositor COVER-CROPS each camera into its pane (composite.mjs videoChain),
  and lib/podcast/paneAspect.ts mirrors the pane shape below for the live
  preview — if the pane geometry changes, change that constant too.

  GEOMETRY (the compositing contract, read back live):
    #pane-left   x=24   y=48  w=930  h=1008
    #pane-right  x=966  y=48  w=930  h=1008
  Margins 24 sides / 48 top (badge band) / 24 bottom; 12px center gutter.
  Pane divs carry NO border — the gold mounts are separate divs 4px outside —
  so the reported border-box rect is exactly the video area.

  Self-contained: no external fetches. Libre Caslon Text 400 (latin subset)
  and the wax-seal image are data URIs. Brand sources (read-only, never
  modified from this repo):
    tokens    ~/Desktop/humanym/web/src/styles/tokens.css
    wordmark  human + gold "ym", Libre Caslon Text (web/public/logo-wordmark.png)
    seal      ~/Desktop/humanym/humanym-mobile/assets/images/icon.png (app icon)

  Zero PII: #label-left / #label-right start empty and are filled by
  renderBackdrop's page.evaluate() with the episode's codenames — nothing
  identifying is baked into this file. HOST NAMES ARE OFF (locked 2026-08-03):
  .label-plate is display:none; the elements stay for the contract. To show
  names again, restore the plate styling and record under the desired
  codenames.
-->

    overflow: hidden;
  }

  body { position: relative; background: var(--paper); }

  /* Brand plaque — a raised paper chip: h wax seal + wordmark. Top-left,
     persistent on every frame (the link itself lives in the video
     description; video pixels can't be clickable). */
  .badge {
    position: absolute;
    left: 20px;
    top: 4px;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-lt);
    border: 1px solid var(--gold-border);
    padding: 5px 14px 5px 6px;
    z-index: 2;
  }
  /* multiply kills the icon photo's near-white square; the circle crop
     removes the residue at the corners while keeping the wax shadow. */
  .badge img {
    height: 34px;
    width: 34px;
    border-radius: 50%;
    mix-blend-mode: multiply;
  }
  .badge .wordmark {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1;
  }
  .badge .wordmark em { color: var(--gold-mid); font-style: normal; }

  /* Pane wells — flat ink; with cover-crop the video fills them entirely,
     so this color only ever shows if a render is inspected pre-composite. */
  .pane-well {
    position: absolute;
    top: 48px;
    width: 930px;
    height: 1008px;
    background: var(--ink);
    z-index: 1;
  }
  #pane-left { left: 24px; }
  #pane-right { left: 966px; }

  /* Gold hairline mounts, 4px outside each pane (rule sits 3px clear of the
     video edge). Separate divs so pane rects stay exactly 930x1008. */
  .mount {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    border: 1px solid var(--gold-border);
  }
  #mount-left  { left: 20px; top: 44px; width: 938px; height: 1016px; }
  #mount-right { left: 962px; top: 44px; width: 938px; height: 1016px; }

  /* Host names OFF (design decision 2026-08-03) — elements kept for the
     renderBackdrop contract; restore styling here to show names again. */
  .label-plate { display: none; }

  /* Gold dot, bottom center — the og-image motif; the page's only other mark. */
  .dot {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    z-index: 2;
  }
</style>
</head>
