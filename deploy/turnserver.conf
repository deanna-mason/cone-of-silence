# coturn — Cone of Silence TURN relay (Phase 4A).
# Installed by deploy.sh, which appends the static-auth-secret line from the
# server .env on the box (single secret source; this file stays secret-free).
listening-port=3478
external-ip=143.110.227.84
realm=turn.coneofsilence.app
use-auth-secret
fingerprint
min-port=49160
max-port=49200
# No TLS-TURN (5349) — YAGNI per Phase 4 spec; revisit on drill evidence.
no-tls
no-dtls
no-cli
syslog
# The relay must never reach loopback/private-network services.
# The droplet's own public IP is deliberately NOT denied: when both callers
# are relayed (the CGNAT<->CGNAT case TURN exists for), each peer address IS
# this box's IP — denying it breaks relay-to-relay media (verified live
# 2026-07-25: forceTurn drill times out with the deny in place). Residual
# exposure (authed relay user reaching host services via the public IP) is a
# ledgered Phase 5/6 hardening item.
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
