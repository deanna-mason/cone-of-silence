# coturn — Cone of Silence TURN relay (Phase 4A).
# Installed by deploy.sh, which appends the static-auth-secret line from the
# server .env on the box (single secret source; this file stays secret-free).
listening-port=3478
external-ip=143.110.227.84
realm=turn.coneofsilence.app
use-auth-secret
fingerprint
min-port=49160
max-port=49200
# No TLS-TURN (5349) — YAGNI per Phase 4 spec; revisit on drill evidence.
no-tls
no-dtls
no-cli
syslog
# The relay must never reach the box's own or private-network services.
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
