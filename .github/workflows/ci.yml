# CI — lint, typecheck, and tests for both packages (root Next.js app +
# server/ Express API). Triggers: push, PR, manual (workflow_dispatch).
# Live-Supabase tests self-skip without credentials, so no secrets are wired
# up here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web (lint, typecheck, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # Non-blocking until the 51 pre-existing react-hooks/any errors are burned down — remove this line then.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  server:
    name: server (typecheck, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run
